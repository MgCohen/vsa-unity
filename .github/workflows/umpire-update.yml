# Opens a PR that moves the package to the newest Umpire release of vsa-template.
# It runs each day and on demand. With the input "version", it takes that release.
# The Unity tests and the IL2CPP check do not run here: run them on a dev computer before the merge.
name: Update Umpire

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Umpire version, for example 0.2.0-preview.22. Empty: the newest release."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: umpire-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the DLLs
        id: update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = ./update-umpire.ps1 -Version "${{ inputs.version }}"
          $out
          $version = ($out | Select-String '^version=(.+)$').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The package is already on Umpire $VERSION."
            exit 0
          fi
          branch="umpire/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "The branch $branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A Packages/com.vsa.core
          git commit -m "Move the package to Umpire $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Move the package to Umpire $VERSION" \
            --body "The workflow \`umpire-update.yml\` moved the package to Umpire $VERSION from the release archive of vsa-template: https://github.com/MgCohen/vsa-template/releases/tag/v$VERSION

          Before the merge, run \`./run-tests.ps1\` and \`./il2cpp-check.ps1\` on a dev computer."
