:root {
  /* ---------- Layer 1: primitives (raw values) ---------- */
  --prim-gold-200: #fff0b8;
  --prim-gold-300: #ffd760;
  --prim-gold-500: #f5a300;
  --prim-gold-800: #8f4f00;
  --prim-ink-900: #3a1d00;

  --prim-gray-200: #e4e4e4;
  --prim-gray-400: #a7a7a7;
  --prim-gray-600: #6b6b6b;
  --prim-gray-700: #545454;

  --prim-sky-300: #7fe0ff;

  --prim-night-950: #0d0b24;
  --prim-night-800: #2a2166;
  --prim-violet-600: #5b3cc4;

  --prim-radius-lg: 22px;
  --prim-size-1: 4px;
  --prim-size-3: 12px;
  --prim-size-16: 64px;
  --prim-font-ui: "Inter", sans-serif;
  --prim-font-weight-strong: 600;

  /* ---------- Layer 2: semantic (meaning) ---------- */
  --sem-action-top: var(--prim-gold-300);
  --sem-action-bottom: var(--prim-gold-500);
  --sem-action-depth: var(--prim-gold-800);
  --sem-action-shine: var(--prim-gold-200);
  --sem-on-action: var(--prim-ink-900);

  --sem-disabled-top: var(--prim-gray-200);
  --sem-disabled-bottom: var(--prim-gray-400);
  --sem-disabled-depth: var(--prim-gray-700);
  --sem-on-disabled: var(--prim-gray-600);

  --sem-focus: var(--prim-sky-300);

  --sem-backdrop-center: var(--prim-violet-600);
  --sem-backdrop-mid: var(--prim-night-800);
  --sem-backdrop-edge: var(--prim-night-950);

  --sem-radius-control: var(--prim-radius-lg);
  --sem-screen-margin: var(--prim-size-16);
  --sem-font-ui: var(--prim-font-ui);

  /* ---------- Layer 3: component (button) ---------- */
  --button-width: 320px;
  --button-face-height: 96px;
  --button-depth: var(--prim-size-3);          /* lip under the face */
  --button-depth-pressed: var(--prim-size-1);  /* lip when pressed */
  --button-radius: var(--sem-radius-control);
  --button-shine-height: 6px;
  --button-focus-width: 5px;

  --button-top: var(--sem-action-top);
  --button-bottom: var(--sem-action-bottom);
  --button-lip: var(--sem-action-depth);
  --button-shine: var(--sem-action-shine);
  --button-label: var(--sem-on-action);
  --button-hover-brightness: 1.08;
  --button-focus: var(--sem-focus);

  --button-disabled-top: var(--sem-disabled-top);
  --button-disabled-bottom: var(--sem-disabled-bottom);
  --button-disabled-lip: var(--sem-disabled-depth);
  --button-disabled-label: var(--sem-on-disabled);

  --button-font: var(--sem-font-ui);
  --button-font-weight: var(--prim-font-weight-strong);
  --button-font-size: 40px;
  --button-letter-spacing: 2px;
}

</style>
<style>
/* ds-button: a chunky game button.
   The box is the face plus the lip under it:
   height = face height + depth.
   The face moves down when pressed, so the lip gets thinner.
   All visuals stay inside the box, so one sprite per state holds them. */

.ds-button {
  position: relative;
  display: inline-block;
  box-sizing: border-box;
  width: var(--button-width);
  height: calc(var(--button-face-height) + var(--button-depth));
  padding: 0;
  border: 0;
  border-radius: var(--button-radius);
  background: transparent;
  font-family: var(--button-font);
  font-weight: var(--button-font-weight);
  font-size: var(--button-font-size);
  letter-spacing: var(--button-letter-spacing);
  text-transform: uppercase;
  color: var(--button-label);
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

/* the lip: a face-shaped block, offset down by the depth */
.ds-button::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--button-face-height);
  border-radius: var(--button-radius);
  background: var(--button-lip);
}

.ds-button__face {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: var(--button-face-height);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--button-radius);
  background: linear-gradient(to bottom, var(--button-top), var(--button-bottom));
  box-shadow: inset 0 var(--button-shine-height) 0 0 var(--button-shine);
}

/* hover */
.ds-button:hover:not(:disabled) .ds-button__face,
.ds-button.is-hover .ds-button__face {
  filter: brightness(var(--button-hover-brightness));
}

/* pressed: the face moves down, the lip shows less */
.ds-button:active:not(:disabled) .ds-button__face,
.ds-button.is-pressed .ds-button__face {
  top: calc(var(--button-depth) - var(--button-depth-pressed));
  box-shadow: none;
}

/* focus: a ring inside the face */
.ds-button:focus-visible .ds-button__face,
.ds-button.is-focus .ds-button__face {
  box-shadow:
    inset 0 0 0 var(--button-focus-width) var(--button-focus),
    inset 0 calc(var(--button-shine-height) + var(--button-focus-width)) 0 0 var(--button-shine);
}

/* disabled */
.ds-button:disabled,
.ds-button.is-disabled {
  color: var(--button-disabled-label);
  cursor: default;
}
.ds-button:disabled .ds-button__face,
.ds-button.is-disabled .ds-button__face {
  background: linear-gradient(to bottom, var(--button-disabled-top), var(--button-disabled-bottom));
  box-shadow: inset 0 var(--button-shine-height) 0 0 rgba(255, 255, 255, 0.5);
  filter: none;
}

.ds-button:disabled::before,
.ds-button.is-disabled::before { background: var(--button-disabled-lip); }

/* export only: hide the label, so the sprite has no text */
.ds-button.no-label .ds-button__label { visibility: hidden; }

</style>
<style>
  body { margin: 0; background: #f4f3f8; color: #1d1b29; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 8px; }
  p.lead { margin: 0 0 16px; color: #555; }
  .stage { background: radial-gradient(circle at 50% 40%, var(--sem-backdrop-center), var(--sem-backdrop-mid) 55%, var(--sem-backdrop-edge)); border-radius: 12px; padding: 32px 16px; overflow-x: auto; }
  .states { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .state { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; font-size: 13px; }
  .tbl { overflow-x: auto; background: #fff; border-radius: 10px; border: 1px solid #ddd; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #faf9fd; }
  td code { font: 12px ui-monospace, monospace; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0003; vertical-align: -2px; margin-right: 6px; }
  .layer { font-size: 11px; padding: 2px 6px; border-radius: 99px; background: #ece9f7; }
  .play { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
  .play label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .play code { font-size: 12px; }
  button.reset { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Design system: button</h1>
  <p class="lead">One component, its states and its tokens. Change a primitive token below, and the semantic and component layers follow.</p>

  <h2>States</h2>
  <div class="stage">
    <div class="states">
      <div class="state"><button class="ds-button" tabindex="-1"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Normal</div>
      <div class="state"><button class="ds-button is-hover" tabindex="-1"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Hover</div>
      <div class="state"><button class="ds-button is-pressed" tabindex="-1"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Pressed</div>
      <div class="state"><button class="ds-button is-focus" tabindex="-1"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Focus</div>
      <div class="state"><button class="ds-button is-disabled" tabindex="-1"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Disabled</div>
    </div>
  </div>

  <h2>Live button</h2>
  <div class="stage">
    <div class="states">
      <div class="state"><button class="ds-button"><span class="ds-button__face"><span class="ds-button__label">Play</span></span></button>Hover, press or Tab to it</div>
    </div>
  </div>

  <h2>Change a primitive</h2>
  <div class="play" id="play"></div>
  <button class="reset" id="reset">Reset</button>

  <h2>Tokens</h2>
  <div class="tbl"><table id="tokens"><thead><tr><th>Layer</th><th>Token</th><th>Refers to</th><th>Value</th></tr></thead><tbody></tbody></table></div>
</main>

<script>
  // Read the token declarations from tokens.css, so the gallery never repeats them.
  function readTokens() {
    const out = [];
    for (const sheet of document.styleSheets) {
      const isTokens = (sheet.href && sheet.href.endsWith('tokens.css')) || (sheet.ownerNode && sheet.ownerNode.id === 'tokens');
      if (!isTokens) continue;
      for (const rule of sheet.cssRules) {
        if (rule.selectorText !== ':root') continue;
        for (const name of rule.style) {
          if (!name.startsWith('--')) continue;
          out.push({ name, raw: rule.style.getPropertyValue(name).trim() });
        }
      }
    }
    return out;
  }
  const layerOf = n => n.startsWith('--prim-') ? 'primitive' : n.startsWith('--sem-') ? 'semantic' : 'component';
  const isColor = v => /^#|^rgb/.test(v);

  const tokens = readTokens();
  const tbody = document.querySelector('#tokens tbody');
  function renderTable() {
    const cs = getComputedStyle(document.documentElement);
    tbody.innerHTML = '';
    for (const t of tokens) {
      const value = cs.getPropertyValue(t.name).trim();
      const ref = (t.raw.match(/var\((--[\w-]+)\)/g) || []).map(s => s.slice(4, -1)).join(', ');
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="layer">${layerOf(t.name)}</span></td><td><code>${t.name}</code></td><td><code>${ref || '—'}</code></td>` +
        `<td>${isColor(value) ? `<span class="sw" style="background:${value}"></span>` : ''}<code>${value}</code></td>`;
      tbody.appendChild(tr);
    }
  }

  // Controls for a few primitives. A change sets the primitive on :root.
  const play = document.getElementById('play');
  const controls = [
    ['--prim-gold-300', 'color'], ['--prim-gold-500', 'color'], ['--prim-gold-800', 'color'],
    ['--prim-ink-900', 'color'], ['--prim-sky-300', 'color'],
    ['--prim-radius-lg', 'range', 0, 48], ['--prim-size-3', 'range', 0, 24],
  ];
  const root = document.documentElement;
  for (const [name, type, min, max] of controls) {
    const cur = getComputedStyle(root).getPropertyValue(name).trim();
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = type;
    if (type === 'range') { input.min = min; input.max = max; input.value = parseInt(cur); }
    else input.value = cur;
    input.addEventListener('input', () => {
      root.style.setProperty(name, type === 'range' ? input.value + 'px' : input.value);
      renderTable();
    });
    label.innerHTML = `<code>${name}</code>`;
    label.appendChild(input);
    play.appendChild(label);
  }
  document.getElementById('reset').onclick = () => { root.removeAttribute('style'); location.reload(); };

  renderTable();
</script>
</body>
